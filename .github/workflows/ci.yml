name: CI

# No secrets are used anywhere in this file. The database below is a throw-away container that exists only for the run
# (its password is not a secret), the tests make their own random JWT secret, and the AI is switched OFF and the network
# blocked inside the tests (backend/tests/conftest.py), so nothing here calls OpenRouter or any website.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: landstack            # legacy infrastructure name, kept on purpose (see README)
          POSTGRES_PASSWORD: ci-throwaway-password
          POSTGRES_DB: landstack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U landstack -d landstack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: landstack
      POSTGRES_PASSWORD: ci-throwaway-password
      POSTGRES_DB: landstack
      PGPASSWORD: ci-throwaway-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Python packages (exact versions)
        run: pip install -r backend/requirements.txt
      - name: Create the schema
        run: psql -h localhost -U landstack -d landstack -v ON_ERROR_STOP=1 -f db/schema.sql
      - name: Seed the fake data (same seed = same data)
        run: python db/seed.py
      - name: Run the tests
        run: python -m pytest backend/tests -q

  frontend:
    name: Frontend (design check and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Design rules
        run: npm run check:design
      - name: Type check and production build
        run: npm run build
