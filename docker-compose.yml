services:
  db:
    image: postgis/postgis:16-3.4
    container_name: ${LANDSTACK_DB_CONTAINER:-landstack-db}   # a variable so a second copy can run beside it
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-landstack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-landstack}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db:/var/lib/postgresql/data   # volume landstack_db (new in Phase 13c: the old volume is left alone)

volumes:
  db:
