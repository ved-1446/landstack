# Render blueprint for the LandStack API (Phase 14a). Optional: you can also create the same service by hand (docs/DEPLOY.md).
# Only NAMES and harmless defaults live here. Every secret is entered in the Render dashboard (sync: false) or generated by Render.
services:
  - type: web
    name: landstack-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # the Neon connection string (the direct, non-pooled one). Required.
      - key: DATABASE_URL
        sync: false
      # Render makes a long random value and keeps it; it never appears in the repo
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      # the Vercel address of the website, e.g. https://landstack.vercel.app (several allowed, separated by commas)
      - key: CORS_ORIGINS
        sync: false
      # the address of THIS API (it is printed into every passport's QR code), e.g. https://landstack-api.onrender.com
      - key: PUBLIC_BASE_URL
        sync: false
      # how many proxies sit in front of the app and append to X-Forwarded-For (see docs/DEPLOY.md before changing)
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # optional: leave both empty and the app uses the code-written explanations
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
